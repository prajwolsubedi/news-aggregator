services:
  - type: web
    name: ai-news-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SERP_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

databases:
  - name: ai-news-db
    plan: free
    databaseName: ai_news
    user: ai_news_user
